name: Release Please

on:
  push:
    branches:
      - main
  schedule:
    # Mondays 00:00 UTC (09:00 JST): auto-ship the week's patch release.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # Weekly (schedule) or on manual dispatch: if the open Release PR is a
  # patch-only bump, merge it automatically. feat (minor) and breaking (major)
  # Release PRs are left open for a human to merge.
  auto-merge-patch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Merge patch-only Release PR
        run: |
          set -euo pipefail

          pr=$(gh pr list --state open --label "autorelease: pending" \
                 --json number,title,mergeStateStatus --limit 1)
          num=$(jq -r '.[0].number // empty' <<<"$pr")
          if [ -z "$num" ]; then
            echo "No open Release PR; nothing to do."
            exit 0
          fi

          # Release PR title looks like: chore(main): release 0.2.1
          title=$(jq -r '.[0].title' <<<"$pr")
          new=$(sed -nE 's/.*release ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' <<<"$title")
          if [ -z "$new" ]; then
            echo "Could not parse a version from the Release PR title: $title"
            exit 0
          fi

          cur=$(jq -r '.["."]' .release-please-manifest.json)
          echo "current=$cur proposed=$new"

          IFS=. read -r cmaj cmin cpat <<<"$cur"
          IFS=. read -r nmaj nmin npat <<<"$new"

          if [ "$nmaj" != "$cmaj" ] || [ "$nmin" != "$cmin" ] || [ "$npat" -le "$cpat" ]; then
            echo "Not a patch bump ($cur -> $new); leaving PR #$num for manual review."
            exit 0
          fi

          state=$(jq -r '.[0].mergeStateStatus' <<<"$pr")
          case "$state" in
            CLEAN|UNSTABLE)
              echo "Patch bump ($cur -> $new); merging PR #$num (mergeState=$state)."
              gh pr merge "$num" --merge
              ;;
            *)
              echo "PR #$num is a patch bump but not mergeable yet (mergeState=$state); skipping."
              ;;
          esac

  # Maintains the Release PR from Conventional Commits on main. When a Release
  # PR has been merged (by a human for minor/major, or by auto-merge-patch for
  # patch), this creates the tag and the GitHub Release.
  # Runs on push, and after auto-merge-patch on schedule/dispatch.
  release-please:
    needs: [auto-merge-patch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when a release was created. Builds cross-platform binaries and
  # appends them to that release.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
